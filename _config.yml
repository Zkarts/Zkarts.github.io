description: Welcome to my portfolio website. I'm a Senior Programmer in the games industry with experience working on various AAA games.<br>I love games as a medium and everything involved in making them. I have many creative hobbies, often overlapping with game development. I'm always curious and eager to learn. I love collaborating with different disciplines and, as a programmer, getting to tie all the aspects together into a cohesive product and allowing each aspect to shine the best they can.
